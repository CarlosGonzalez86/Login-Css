<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inspiración Bíblica Diaria</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

:root{
    --fondo1:#0f172a;
    --fondo2:#1e3a8a;
    --fondo3:#2563eb;
    --texto:#ffffff;
    --dorado:#ffd700;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,var(--fondo1),var(--fondo2),var(--fondo3));
    color:var(--texto);
    overflow:hidden;
    transition:all .5s ease;
}

body::before{
    content:'';
    position:absolute;
    width:400px;
    height:400px;
    border-radius:50%;
    background:rgba(255,255,255,.08);
    top:-100px;
    right:-100px;
}

body::after{
    content:'';
    position:absolute;
    width:300px;
    height:300px;
    border-radius:50%;
    background:rgba(255,255,255,.05);
    bottom:-100px;
    left:-100px;
}

.contenedor{
    width:90%;
    max-width:850px;
    padding:40px;
    text-align:center;
    border-radius:25px;
    background:rgba(255,255,255,.1);
    backdrop-filter:blur(15px);
    border:1px solid rgba(255,255,255,.2);
    box-shadow:0 8px 32px rgba(0,0,0,.3);
}

.icono{
    font-size:70px;
    margin-bottom:10px;
}

h1{
    margin-bottom:20px;
    font-size:2.3rem;
}

.mensaje{
    font-size:1.4rem;
    line-height:1.7;
    min-height:150px;
    margin-top:25px;
}

.cita{
    margin-top:20px;
    font-size:1.1rem;
    color:var(--dorado);
    font-style:italic;
}

.botones{
    margin-top:30px;
}

button{
    border:none;
    border-radius:50px;
    padding:14px 25px;
    margin:8px;
    cursor:pointer;
    font-size:1rem;
    font-weight:bold;
    transition:.3s;
}

.btn-verso{
    background:var(--dorado);
    color:#111;
}

.btn-whatsapp{
    background:#25D366;
    color:white;
}

.btn-tema{
    background:#64748b;
    color:white;
}

button:hover{
    transform:translateY(-4px);
}

.footer{
    margin-top:30px;
    opacity:.8;
    font-size:.9rem;
}

.tema-claro{
    background:linear-gradient(135deg,#f8fafc,#e2e8f0,#cbd5e1);
    color:#111827;
}

.tema-claro .contenedor{
    background:rgba(255,255,255,.75);
    color:#111827;
}

.tema-claro .cita{
    color:#2563eb;
}

.fade{
    animation:fade .8s;
}

@keyframes fade{
    from{
        opacity:0;
        transform:translateY(15px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

@media(max-width:600px){

    h1{
        font-size:1.8rem;
    }

    .mensaje{
        font-size:1.15rem;
    }

    button{
        width:100%;
    }
}

</style>
</head>

<body>

<div class="contenedor">

    <div class="icono">📖✨</div>

    <h1>Inspiración Bíblica Diaria</h1>

    <div id="mensaje" class="mensaje">
        Dios tiene un propósito hermoso para tu vida.
    </div>

    <div id="cita" class="cita">
        Jeremías 29:11
    </div>

    <div class="botones">

        <button class="btn-verso" onclick="nuevoMensaje()">
            📜 Nuevo Mensaje
        </button>

        <button class="btn-whatsapp" onclick="compartirWhatsApp()">
            📲 Compartir
        </button>

        <button class="btn-tema" onclick="cambiarTema(this)">
            🌙 Tema
        </button>

    </div>

    <div class="footer">
        Dios fortalece, guía y renueva cada día.
    </div>

</div>

<script>

const mensajes = [

{
texto:"No temas los desafíos de hoy. Dios está contigo en cada paso que das y nunca te abandona.",
cita:"Isaías 41:10"
},

{
texto:"La alegría del Señor es tu fortaleza. Sonríe porque Dios sigue obrando a tu favor.",
cita:"Nehemías 8:10"
},

{
texto:"Aunque el camino parezca difícil, Dios abrirá puertas donde hoy ves obstáculos.",
cita:"Salmos 37:5"
},

{
texto:"Cada nuevo día es una oportunidad para comenzar de nuevo con esperanza.",
cita:"Lamentaciones 3:22-23"
},

{
texto:"Dios renueva tus fuerzas para que vueles como las águilas y nunca desmayes.",
cita:"Isaías 40:31"
},

{
texto:"La paz de Dios guardará tu corazón incluso en medio de las tormentas.",
cita:"Filipenses 4:7"
},

{
texto:"Todo lo puedo en Cristo que me fortalece.",
cita:"Filipenses 4:13"
},

{
texto:"Confía en el Señor con todo tu corazón y Él dirigirá tus caminos.",
cita:"Proverbios 3:5-6"
},

{
texto:"La esperanza en Dios ilumina incluso los días más oscuros.",
cita:"Romanos 15:13"
},

{
texto:"Todo obra para bien de quienes aman a Dios.",
cita:"Romanos 8:28"
}

];

function nuevoMensaje(){

let aleatorio =
mensajes[Math.floor(Math.random()*mensajes.length)];

let mensaje =
document.getElementById("mensaje");

let cita =
document.getElementById("cita");

mensaje.classList.remove("fade");
void mensaje.offsetWidth;
mensaje.classList.add("fade");

mensaje.textContent = aleatorio.texto;
cita.textContent = aleatorio.cita;
}

function compartirWhatsApp(){

let mensaje =
document.getElementById("mensaje").textContent;

let cita =
document.getElementById("cita").textContent;

let texto = encodeURIComponent(
`📖 Inspiración Bíblica Diaria

"${mensaje}"

✨ ${cita}

🙏 Dios te bendiga.`
);

window.open(
`https://wa.me/?text=${texto}`,
"_blank"
);

}

function cambiarTema(boton){

document.body.classList.toggle("tema-claro");

if(document.body.classList.contains("tema-claro")){

    localStorage.setItem("tema","claro");
    boton.innerHTML = "☀️ Tema Claro";

}else{

    localStorage.setItem("tema","oscuro");
    boton.innerHTML = "🌙 Tema Oscuro";
}

}

window.onload = function(){

if(localStorage.getItem("tema") === "claro"){

    document.body.classList.add("tema-claro");

    document.querySelector(".btn-tema").innerHTML =
    "☀️ Tema Claro";
}

nuevoMensaje();

};

</script>

</body>
</html>

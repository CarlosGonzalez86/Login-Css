<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Inspiración Bíblica Diaria</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Segoe UI", Arial, sans-serif;
}

:root {
    --fondo-1: #071a35;
    --fondo-2: #123e73;
    --fondo-3: #2d75c7;
    --texto: #ffffff;
    --cristal: rgba(255, 255, 255, 0.12);
    --borde: rgba(255, 255, 255, 0.22);
    --dorado: #ffd76a;
}

body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 25px;
    background: linear-gradient(
        135deg,
        var(--fondo-1),
        var(--fondo-2),
        var(--fondo-3)
    );
    color: var(--texto);
    overflow-x: hidden;
    transition: background 0.5s, color 0.5s;
}

body::before,
body::after {
    content: "";
    position: fixed;
    border-radius: 50%;
    pointer-events: none;
    z-index: 0;
}

body::before {
    width: 420px;
    height: 420px;
    top: -150px;
    right: -130px;
    background: rgba(255, 255, 255, 0.08);
}

body::after {
    width: 320px;
    height: 320px;
    bottom: -120px;
    left: -110px;
    background: rgba(255, 215, 106, 0.08);
}

.contenedor {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 850px;
    padding: 42px;
    text-align: center;
    border-radius: 28px;
    background: var(--cristal);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    border: 1px solid var(--borde);
    box-shadow: 0 20px 55px rgba(0, 0, 0, 0.28);
}

.icono {
    font-size: 65px;
    margin-bottom: 12px;
}

h1 {
    font-size: clamp(1.8rem, 5vw, 2.7rem);
    margin-bottom: 10px;
}

.subtitulo {
    opacity: 0.82;
    margin-bottom: 25px;
}

.mensaje {
    min-height: 145px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(1.2rem, 3.5vw, 1.55rem);
    line-height: 1.7;
    padding: 10px;
}

.cita {
    margin-top: 15px;
    color: var(--dorado);
    font-size: 1.08rem;
    font-weight: 700;
}

.botones {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 12px;
    margin-top: 32px;
}

button {
    border: none;
    border-radius: 50px;
    padding: 14px 22px;
    cursor: pointer;
    font-size: 0.97rem;
    font-weight: 700;
    transition: transform 0.25s, box-shadow 0.25s;
}

button:hover {
    transform: translateY(-4px);
    box-shadow: 0 10px 20px rgba(0, 0, 0, 0.18);
}

button:active {
    transform: translateY(0);
}

.btn-mensaje {
    background: var(--dorado);
    color: #172033;
}

.btn-whatsapp {
    background: #25d366;
    color: white;
}

.btn-instagram {
    color: white;
    background: linear-gradient(
        45deg,
        #feda75,
        #fa7e1e,
        #d62976,
        #962fbf,
        #4f5bd5
    );
}

.btn-tema {
    background: #64748b;
    color: white;
}

.estado {
    min-height: 24px;
    margin-top: 22px;
    font-size: 0.9rem;
    opacity: 0.85;
}

footer {
    position: relative;
    z-index: 1;
    margin-top: 25px;
    text-align: center;
    font-size: 0.95rem;
    opacity: 0.85;
}

/* Tema claro */

body.tema-claro {
    --texto: #162033;
    --cristal: rgba(255, 255, 255, 0.78);
    --borde: rgba(255, 255, 255, 0.95);
    --dorado: #175cc5;

    background: linear-gradient(
        135deg,
        #f8fbff,
        #ddeaff,
        #b9d5fa
    );
}

body.tema-claro .contenedor {
    box-shadow: 0 20px 55px rgba(37, 80, 135, 0.2);
}

/* Animación */

.fade {
    animation: aparecer 0.7s ease;
}

@keyframes aparecer {
    from {
        opacity: 0;
        transform: translateY(14px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@media (max-width: 620px) {
    body {
        padding: 18px;
    }

    .contenedor {
        padding: 30px 20px;
    }

    .botones {
        flex-direction: column;
    }

    button {
        width: 100%;
    }
}
</style>
</head>

<body>

<main class="contenedor">

    <div class="icono">📖✨</div>

    <h1>Inspiración Bíblica Diaria</h1>

    <p class="subtitulo">
        Una palabra de fe, fortaleza y esperanza para tu día
    </p>

    <div id="mensaje" class="mensaje">
        Dios tiene un propósito hermoso para tu vida.
    </div>

    <div id="cita" class="cita">
        Jeremías 29:11
    </div>

    <div class="botones">

        <button class="btn-mensaje" onclick="nuevoMensaje()">
            📜 Nuevo mensaje
        </button>

        <button class="btn-whatsapp" onclick="compartirImagen('WhatsApp')">
            📲 WhatsApp
        </button>

        <button class="btn-instagram" onclick="compartirImagen('Instagram')">
            📸 Instagram
        </button>

        <button id="botonTema" class="btn-tema" onclick="cambiarTema()">
            ☀️ Modo claro
        </button>

    </div>

    <p id="estado" class="estado"></p>

</main>

<footer>
    <p>© Creado por Licdo. Carlos E. González</p>
</footer>

<script>
const mensajes = [
    {
        texto: "No temas los desafíos de hoy. Dios está contigo en cada paso que das y nunca te abandona.",
        cita: "Isaías 41:10"
    },
    {
        texto: "La alegría del Señor es tu fortaleza. Sonríe porque Dios sigue obrando a tu favor.",
        cita: "Nehemías 8:10"
    },
    {
        texto: "Aunque el camino parezca difícil, Dios abrirá puertas donde hoy ves obstáculos.",
        cita: "Salmos 37:5"
    },
    {
        texto: "Cada nuevo día es una oportunidad para comenzar de nuevo con esperanza.",
        cita: "Lamentaciones 3:22-23"
    },
    {
        texto: "Dios renueva tus fuerzas para que vueles como las águilas y no desmayes.",
        cita: "Isaías 40:31"
    },
    {
        texto: "La paz de Dios guardará tu corazón incluso en medio de las tormentas.",
        cita: "Filipenses 4:7"
    },
    {
        texto: "Todo lo puedo en Cristo que me fortalece.",
        cita: "Filipenses 4:13"
    },
    {
        texto: "Confía en el Señor con todo tu corazón y Él dirigirá tus caminos.",
        cita: "Proverbios 3:5-6"
    },
    {
        texto: "La esperanza en Dios ilumina incluso los días más oscuros.",
        cita: "Romanos 15:13"
    },
    {
        texto: "Todo obra para bien de quienes aman a Dios.",
        cita: "Romanos 8:28"
    }
];

let indiceActual = -1;

function nuevoMensaje() {
    let nuevoIndice;

    do {
        nuevoIndice = Math.floor(Math.random() * mensajes.length);
    } while (
        nuevoIndice === indiceActual &&
        mensajes.length > 1
    );

    indiceActual = nuevoIndice;

    const mensaje = document.getElementById("mensaje");
    const cita = document.getElementById("cita");

    mensaje.classList.remove("fade");
    cita.classList.remove("fade");

    void mensaje.offsetWidth;

    mensaje.textContent = mensajes[indiceActual].texto;
    cita.textContent = mensajes[indiceActual].cita;

    mensaje.classList.add("fade");
    cita.classList.add("fade");

    mostrarEstado("");
}

function cambiarTema() {
    document.body.classList.toggle("tema-claro");

    const temaClaro =
        document.body.classList.contains("tema-claro");

    localStorage.setItem(
        "temaBiblico",
        temaClaro ? "claro" : "oscuro"
    );

    actualizarBotonTema();
}

function actualizarBotonTema() {
    const boton = document.getElementById("botonTema");
    const temaClaro =
        document.body.classList.contains("tema-claro");

    boton.textContent = temaClaro
        ? "🌙 Modo oscuro"
        : "☀️ Modo claro";
}

/*
 Esta función divide el texto en varias líneas
 para evitar que se salga de la imagen.
*/
function dibujarTextoAjustado(
    contexto,
    texto,
    centroX,
    inicioY,
    anchoMaximo,
    alturaLinea
) {
    const palabras = texto.split(" ");
    const lineas = [];
    let lineaActual = "";

    palabras.forEach(palabra => {
        const lineaPrueba =
            lineaActual + palabra + " ";

        const ancho =
            contexto.measureText(lineaPrueba).width;

        if (ancho > anchoMaximo && lineaActual !== "") {
            lineas.push(lineaActual.trim());
            lineaActual = palabra + " ";
        } else {
            lineaActual = lineaPrueba;
        }
    });

    lineas.push(lineaActual.trim());

    lineas.forEach((linea, indice) => {
        contexto.fillText(
            linea,
            centroX,
            inicioY + indice * alturaLinea
        );
    });

    return inicioY + lineas.length * alturaLinea;
}

/*
 Crea una imagen PNG utilizando Canvas.
*/
function crearImagen() {
    return new Promise((resolver, rechazar) => {
        const canvas = document.createElement("canvas");

        // Formato vertical ideal para estados e historias.
        canvas.width = 1080;
        canvas.height = 1350;

        const ctx = canvas.getContext("2d");

        if (!ctx) {
            rechazar(new Error("No se pudo crear la imagen."));
            return;
        }

        const mensaje =
            document.getElementById("mensaje").textContent;

        const cita =
            document.getElementById("cita").textContent;

        const gradiente = ctx.createLinearGradient(
            0,
            0,
            canvas.width,
            canvas.height
        );

        gradiente.addColorStop(0, "#071a35");
        gradiente.addColorStop(0.5, "#123e73");
        gradiente.addColorStop(1, "#2d75c7");

        ctx.fillStyle = gradiente;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Decoraciones de fondo
        ctx.globalAlpha = 0.08;
        ctx.fillStyle = "#ffffff";

        ctx.beginPath();
        ctx.arc(930, 140, 260, 0, Math.PI * 2);
        ctx.fill();

        ctx.beginPath();
        ctx.arc(100, 1220, 230, 0, Math.PI * 2);
        ctx.fill();

        ctx.globalAlpha = 1;

        // Tarjeta central
        ctx.fillStyle = "rgba(255,255,255,0.11)";
        ctx.strokeStyle = "rgba(255,255,255,0.30)";
        ctx.lineWidth = 3;

        ctx.beginPath();
        ctx.roundRect(90, 100, 900, 1130, 45);
        ctx.fill();
        ctx.stroke();

        ctx.textAlign = "center";
        ctx.textBaseline = "middle";

        ctx.fillStyle = "#ffd76a";
        ctx.font = "bold 80px Arial";
        ctx.fillText("✦", 540, 215);

        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 55px Arial";
        ctx.fillText(
            "Inspiración Bíblica",
            540,
            320
        );

        ctx.fillStyle = "rgba(255,255,255,0.78)";
        ctx.font = "30px Arial";
        ctx.fillText(
            "Fortaleza, fe y esperanza para tu día",
            540,
            385
        );

        // Mensaje principal
        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 48px Arial";

        const finalTexto = dibujarTextoAjustado(
            ctx,
            `“${mensaje}”`,
            540,
            570,
            760,
            72
        );

        // Cita
        ctx.fillStyle = "#ffd76a";
        ctx.font = "bold 36px Arial";
        ctx.fillText(cita, 540, finalTexto + 100);

        // Firma
        ctx.fillStyle = "rgba(255,255,255,0.82)";
        ctx.font = "27px Arial";
        ctx.fillText(
            "© Creado por Licdo. Carlos E. González",
            540,
            1150
        );

        canvas.toBlob(blob => {
            if (blob) {
                resolver(blob);
            } else {
                rechazar(
                    new Error("No se pudo generar la imagen.")
                );
            }
        }, "image/png");
    });
}

/*
 Intenta compartir la imagen mediante el menú
 nativo del dispositivo. Si no es compatible,
 descarga la imagen.
*/
async function compartirImagen(aplicacion) {
    mostrarEstado("⏳ Preparando imagen...");

    try {
        const blob = await crearImagen();

        const archivo = new File(
            [blob],
            "inspiracion-biblica.png",
            { type: "image/png" }
        );

        const datosCompartir = {
            title: "Inspiración Bíblica Diaria",
            text: `Mensaje de inspiración para compartir por ${aplicacion}.`,
            files: [archivo]
        };

        if (
            navigator.share &&
            navigator.canShare &&
            navigator.canShare({ files: [archivo] })
        ) {
            await navigator.share(datosCompartir);

            mostrarEstado(
                `✅ Imagen lista para compartir por ${aplicacion}.`
            );
        } else {
            descargarImagen(blob);

            mostrarEstado(
                "📥 La imagen fue descargada. Ahora puedes subirla a " +
                aplicacion + "."
            );
        }

    } catch (error) {
        if (error.name === "AbortError") {
            mostrarEstado("Compartir cancelado.");
        } else {
            mostrarEstado(
                "No se pudo compartir. Intenta descargar la imagen."
            );

            console.error(error);
        }
    }
}

function descargarImagen(blob) {
    const enlace = document.createElement("a");
    const urlTemporal = URL.createObjectURL(blob);

    enlace.href = urlTemporal;
    enlace.download = "inspiracion-biblica.png";

    document.body.appendChild(enlace);
    enlace.click();
    enlace.remove();

    URL.revokeObjectURL(urlTemporal);
}

function mostrarEstado(texto) {
    document.getElementById("estado").textContent = texto;
}

window.addEventListener("DOMContentLoaded", () => {
    const temaGuardado =
        localStorage.getItem("temaBiblico");

    if (temaGuardado === "claro") {
        document.body.classList.add("tema-claro");
    }

    actualizarBotonTema();
    nuevoMensaje();
});
</script>

</body>
</html>

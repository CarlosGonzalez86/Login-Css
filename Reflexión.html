<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#071a35">
  <title>Inspiración Bíblica Diaria</title>
  
  <style>
    /* Reset & CSS Variables */
    * {
      box-sizing: border-box;
    }
    
    :root {
      --t: #ffffff;
      --s: #ffffffc7;
      --g: #ffd76a;
      --c: #ffffff1f;
      --b: #ffffff40;
    }

    html, body {
      margin: 0;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 22px;
      color: var(--t);
      font-family: 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(135deg, #071a35, #123e73, #2d75c7);
      transition: background 0.4s, color 0.4s;
    }

    body.claro {
      --t: #162033;
      --s: #162033b8;
      --g: #175cc5;
      --c: #ffffffc7;
      --b: #ffffff;
      background: linear-gradient(135deg, #f8fbff, #ddeaff, #b9d5fa);
    }

    /* Layout Principal */
    main {
      width: min(880px, 100%);
      padding: 40px;
      text-align: center;
      border: 1px solid var(--b);
      border-radius: 28px;
      background: var(--c);
      box-shadow: 0 22px 55px #0004;
      backdrop-filter: blur(18px);
    }

    .icono {
      font-size: 64px;
    }

    h1 {
      margin: 8px 0;
      font-size: clamp(1.8rem, 5vw, 2.7rem);
    }

    .sub {
      color: var(--s);
    }

    #mensaje {
      min-height: 175px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
      font-size: clamp(1.2rem, 3.6vw, 1.6rem);
      line-height: 1.7;
    }

    #cita {
      color: var(--g);
      font-weight: 800;
      font-size: 1.1rem;
    }

    /* Botones */
    .botones {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 11px;
      margin-top: 30px;
    }

    button {
      border: 0;
      border-radius: 99px;
      padding: 14px 20px;
      font-weight: 800;
      font-size: 0.96rem;
      cursor: pointer;
      transition: transform 0.2s, background-color 0.2s;
    }

    button:hover {
      transform: translateY(-3px);
    }

    .nuevo {
      background: var(--g);
      color: #172033;
    }

    .compartir {
      background: #25d366;
      color: #ffffff;
    }

    .instagram {
      color: #ffffff;
      background: linear-gradient(45deg, #fa7e1e, #d62976, #962fbf);
    }

    .tema {
      background: #64748b;
      color: #ffffff;
    }

    #estado {
      min-height: 24px;
      color: var(--s);
      font-size: 0.9rem;
      margin: 20px 0 0;
    }

    footer {
      margin-top: 22px;
      text-align: center;
      opacity: 0.88;
    }

    /* Animación Fade */
    .fade {
      animation: fade 0.6s;
    }

    @keyframes fade {
      from {
        opacity: 0;
        transform: translateY(12px);
      }
      to {
        opacity: 1;
        transform: none;
      }
    }

    /* Adaptación Mobile */
    @media (max-width: 620px) {
      main {
        padding: 28px 18px;
      }
      .botones {
        flex-direction: column;
      }
      button {
        width: 100%;
      }
    }
  </style>
</head>
<body>

  <main>
    <div class="icono">📖✨</div>
    <h1>Inspiración Bíblica Diaria</h1>
    <p class="sub">Una palabra de fe, fortaleza y esperanza para tu día</p>
    
    <div id="mensaje" aria-live="polite"></div>
    <div id="cita"></div>

    <div class="botones">
      <button class="nuevo" id="nuevo">📜 Nuevo mensaje</button>
      <button class="compartir" id="compartir">📤 Compartir imagen</button>
      <button class="instagram" id="instagram">📸 Descargar para Instagram</button>
      <button class="tema" id="tema">☀️ Modo claro</button>
    </div>

    <p id="estado" aria-live="polite"></p>
  </main>

  <footer>
    <p>© Creado por Licdo. Carlos E. González</p>
  </footer>

  <script>
    // Base de datos de mensajes bíblicos
    const mensajes = [
      ["No tengas miedo ante los desafíos de hoy. Dios camina contigo y sostiene cada uno de tus pasos.", "Isaías 41:10"],
      ["La alegría que viene de Dios puede convertirse en tu fuerza aun durante los días difíciles.", "Nehemías 8:10"],
      ["Encomienda tu camino al Señor, confía en Él y sigue avanzando con esperanza.", "Salmos 37:5"],
      ["Cada amanecer trae nuevas misericordias y una oportunidad para comenzar otra vez.", "Lamentaciones 3:22-23"],
      ["Quienes esperan en Dios reciben nuevas fuerzas para continuar sin rendirse.", "Isaías 40:31"],
      ["La paz de Dios puede guardar tu corazón aun cuando todo parezca incierto.", "Filipenses 4:7"],
      ["Con Cristo puedes encontrar la fortaleza necesaria para enfrentar lo que venga.", "Filipenses 4:13"],
      ["Confía de corazón en el Señor y permite que Él oriente tus decisiones.", "Proverbios 3:5-6"],
      ["Dios puede llenarte de alegría, paz y esperanza cuando depositas tu confianza en Él.", "Romanos 15:13"],
      ["Aun las circunstancias difíciles pueden ser transformadas para bien por Dios.", "Romanos 8:28"],
      ["Dios es refugio, fuerza y ayuda cercana en los momentos de angustia.", "Salmos 46:1"],
      ["Sé fuerte y valiente. Dios estará contigo adondequiera que vayas.", "Josué 1:9"],
      ["Permanece en calma y confía: Dios puede luchar batallas que tú no puedes resolver solo.", "Éxodo 14:14"],
      ["Dios se acerca al corazón herido y ayuda a sanar sus heridas.", "Salmos 147:3"],
      ["Cuando atravieses aguas profundas, recuerda que Dios permanece a tu lado.", "Isaías 43:2"],
      ["La oración hecha con fe tiene poder y puede traer transformación.", "Santiago 5:16"],
      ["Vive el día de hoy con confianza y no permitas que el mañana robe tu paz.", "Mateo 6:34"],
      ["Nada está fuera del alcance de Dios. Sigue creyendo incluso cuando no veas el camino.", "Lucas 1:37"],
      ["La bondad y el amor de Dios pueden acompañarte todos los días de tu vida.", "Salmos 23:6"],
      ["Ninguna circunstancia puede separarte del amor que Dios tiene por ti.", "Romanos 8:38-39"],
      ["La fe te permite avanzar con certeza aun antes de ver la respuesta.", "Hebreos 11:1"],
      ["Dios continuará la buena obra que comenzó en tu vida.", "Filipenses 1:6"],
      ["Camina por fe, aunque tus ojos todavía no puedan ver todo el recorrido.", "2 Corintios 5:7"],
      ["El Señor puede ser tu luz y tu seguridad. No permitas que el temor gobierne tu día.", "Salmos 27:1"],
      ["Las pruebas pueden desarrollar perseverancia, carácter y una esperanza más firme.", "Romanos 5:3-4"],
      ["Cuando estés cansado, acércate a Dios y encuentra descanso para tu alma.", "Mateo 11:28"],
      ["Sigue creyendo. La fe abre el corazón a posibilidades que parecían imposibles.", "Marcos 9:23"],
      ["Dios puede abrir un camino nuevo incluso en medio del desierto.", "Isaías 43:19"],
      ["Puedes hacer planes, pero permite que Dios dirija y afirme tus pasos.", "Proverbios 16:9"],
      ["Dios conoce tus lágrimas y comprende incluso las oraciones que no logras expresar.", "Salmos 56:8"],
      ["El amor verdadero persevera, confía, espera y permanece firme.", "1 Corintios 13:7"],
      ["Practica la gratitud en cada circunstancia y reconoce la presencia de Dios en tu camino.", "1 Tesalonicenses 5:18"],
      ["Las lágrimas sembradas con fe pueden convertirse en una cosecha de alegría.", "Salmos 126:5"],
      ["Mantente firme: Dios es fiel y cumple lo que promete.", "Números 23:19"],
      ["La palabra de Dios puede iluminar tus pasos y orientarte por el camino correcto.", "Salmos 119:105"],
      ["Dios puede hacer mucho más de lo que alcanzas a pedir o imaginar.", "Efesios 3:20"],
      ["Entrega tus preocupaciones a Dios y permite que Él sostenga tu corazón.", "Salmos 55:22"],
      ["Busca primero a Dios y permite que tus prioridades encuentren un nuevo orden.", "Mateo 6:33"],
      ["Tus cargas no tienen que ser llevadas en soledad. Preséntalas a Dios en oración.", "1 Pedro 5:7"],
      ["Haz el bien sin cansarte. A su debido tiempo podrás ver el fruto de tu perseverancia.", "Gálatas 6:9"],
      ["Dios puede darte sabiduría cuando la pides con sinceridad y confianza.", "Santiago 1:5"],
      ["En medio de la dificultad, recuerda que la presencia de Dios es mayor que tu temor.", "Salmos 23:4"],
      ["Que la esperanza te mantenga alegre, la dificultad te haga perseverante y la oración te mantenga firme.", "Romanos 12:12"],
      ["Dios puede darte un corazón firme, lleno de paz, cuando confías en Él.", "Isaías 26:3"],
      ["Deja atrás lo que te detiene y avanza hacia lo que Dios ha puesto delante de ti.", "Filipenses 3:13-14"]
    ];

    // Selectores DOM
    const $ = id => document.getElementById(id);
    const m = $("mensaje");
    const c = $("cita");
    const e = $("estado");
    const bt = $("tema");
    let actual = -1;

    // Generar nuevo mensaje
    function nuevo() {
      let i;
      do {
        i = Math.floor(Math.random() * mensajes.length);
      } while (i === actual && mensajes.length > 1);
      
      actual = i;
      m.classList.remove("fade");
      c.classList.remove("fade");
      
      void m.offsetWidth; // Trigger reflow para reiniciar la animación
      
      m.textContent = mensajes[i][0];
      c.textContent = mensajes[i][1];
      m.classList.add("fade");
      c.classList.add("fade");
      e.textContent = "";
    }

    // Dividir texto en múltiples líneas para el Canvas
    function lineas(ctx, texto, max) {
      const palabras = texto.split(" ");
      const resultado = [];
      let lineaActual = "";

      for (const palabra of palabras) {
        const testLinea = lineaActual ? lineaActual + " " + palabra : palabra;
        if (ctx.measureText(testLinea).width > max && lineaActual) {
          resultado.push(lineaActual);
          lineaActual = palabra;
        } else {
          lineaActual = testLinea;
        }
      }

      if (lineaActual) resultado.push(lineaActual);
      return resultado;
    }

    // Crear la imagen dinámicamente con Canvas (1080x1920 / 9:16)
    function crearImagen() {
      return new Promise((resolve, reject) => {
        const canvas = document.createElement("canvas");
        canvas.width = 1080;
        canvas.height = 1920;
        
        const ctx = canvas.getContext("2d");
        if (!ctx) return reject(new Error("Canvas no disponible"));

        // Fondo degradado
        const gradiente = ctx.createLinearGradient(0, 0, 1080, 1920);
        gradiente.addColorStop(0, "#071a35");
        gradiente.addColorStop(0.52, "#123e73");
        gradiente.addColorStop(1, "#2d75c7");
        ctx.fillStyle = gradiente;
        ctx.fillRect(0, 0, 1080, 1920);

        // Contenedor translúcido
        ctx.fillStyle = "#ffffff1c";
        ctx.beginPath();
        ctx.roundRect(80, 105, 920, 1640, 48);
        ctx.fill();
        ctx.strokeStyle = "#ffffff55";
        ctx.lineWidth = 3;
        ctx.stroke();

        // Encabezado
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillStyle = "#ffd76a";
        ctx.font = "bold 92px Arial";
        ctx.fillText("✦", 540, 245);

        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 58px Arial";
        ctx.fillText("Inspiración Bíblica", 540, 365);

        ctx.fillStyle = "#ffffffcc";
        ctx.font = "31px Arial";
        ctx.fillText("Fe, fortaleza y esperanza para tu día", 540, 430);

        // Mensaje Principal
        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 49px Arial";
        const arrayLineas = lineas(ctx, "“" + m.textContent.trim() + "”", 770);
        const altoLinea = 76;
        const yBase = 930 - ((arrayLineas.length - 1) * altoLinea) / 2;

        arrayLineas.forEach((linea, index) => {
          ctx.fillText(linea, 540, yBase + index * altoLinea);
        });

        // Cita Bíblica
        ctx.fillStyle = "#ffd76a";
        ctx.font = "bold 38px Arial";
        ctx.fillText(c.textContent.trim(), 540, 1360);

        // Separador
        ctx.strokeStyle = "#ffffff48";
        ctx.beginPath();
        ctx.moveTo(260, 1510);
        ctx.lineTo(820, 1510);
        ctx.stroke();

        // Firma / Crédito
        ctx.fillStyle = "#ffffffdc";
        ctx.font = "29px Arial";
        ctx.fillText("© Creado por Licdo. Carlos E. González", 540, 1625);

        // Exportación como PNG
        canvas.toBlob(blob => {
          if (blob) resolve(blob);
          else reject(new Error("No se pudo generar la imagen PNG"));
        }, "image/png", 1);
      });
    }

    // Convertir Blob a File
    async function obtenerArchivo() {
      const blob = await crearImagen();
      return new File([blob], "inspiracion-biblica.png", { type: "image/png" });
    }

    // Descargar imagen al dispositivo
    function descargar(file) {
      const url = URL.createObjectURL(file);
      const enlace = document.createElement("a");
      enlace.href = url;
      enlace.download = file.name;
      document.body.appendChild(enlace);
      enlace.click();
      enlace.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1500);
    }

    // Compartir mediante la API Nativa
    async function compartir() {
      e.textContent = "⏳ Preparando imagen...";
      try {
        const file = await obtenerArchivo();
        if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
          await navigator.share({
            title: "Inspiración Bíblica Diaria",
            text: "Una palabra de fe y esperanza.",
            files: [file]
          });
          e.textContent = "✅ Imagen enviada al menú para compartir.";
        } else {
          descargar(file);
          e.textContent = "📥 Imagen descargada. Compártela desde tu galería.";
        }
      } catch (err) {
        e.textContent = err.name === "AbortError" ? "Proceso cancelado." : "⚠️ No fue posible compartir.";
      }
    }

    // Generar imagen optimizada para Historias de Instagram
    async function instagram() {
      e.textContent = "⏳ Preparando historia...";
      try {
        const file = await obtenerArchivo();
        descargar(file);
        e.textContent = "📸 Imagen 1080×1920 descargada. Súbela a tu historia desde la galería.";
      } catch {
        e.textContent = "⚠️ No fue posible crear la imagen.";
      }
    }

    // Cambiar entre tema Claro/Oscuro
    function cambiarTema() {
      document.body.classList.toggle("claro");
      const esClaro = document.body.classList.contains("claro");
      localStorage.setItem("temaBiblico", esClaro ? "claro" : "oscuro");
      bt.textContent = esClaro ? "🌙 Modo oscuro" : "☀️ Modo claro";
    }

    // Event Listeners e Inicialización
    $("nuevo").onclick = nuevo;
    $("compartir").onclick = compartir;
    $("instagram").onclick = instagram;
    bt.onclick = cambiarTema;

    // Restaurar preferencia de tema guardada
    if (localStorage.getItem("temaBiblico") === "claro") {
      document.body.classList.add("claro");
    }
    bt.textContent = document.body.classList.contains("claro") ? "🌙 Modo oscuro" : "☀️ Modo claro";

    // Cargar mensaje inicial
    nuevo();
  </script>

</body>
</html>

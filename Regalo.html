<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Feliz Cumpleaños Caroline Romero ❤️</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:'Segoe UI',sans-serif;
    background:linear-gradient(135deg,#1a0010,#3d0c2e,#5c1744);
    min-height:100vh;
    overflow-x:hidden;
    overflow-y:auto;
    color:white;
}

.container{
    width:95%;
    max-width:900px;
    margin:20px auto 100px auto;
    text-align:center;
    position:relative;
    z-index:10;
}

h1{
    font-size:clamp(2rem,5vw,3rem);
    color:#ffd6e7;
    text-shadow:0 0 15px #ff69b4;
    animation:latido 2s infinite;
}

@keyframes latido{
    50%{
        transform:scale(1.05);
    }
}

.subtitulo{
    margin-top:15px;
    font-size:clamp(1rem,3vw,1.3rem);
    color:#ffeaf2;
}

button{
    margin-top:25px;
    padding:15px 30px;
    border:none;
    border-radius:50px;
    background:#ff4f87;
    color:white;
    cursor:pointer;
    font-size:1rem;
    box-shadow:0 5px 15px rgba(0,0,0,.3);
    transition:.3s;
}

button:hover{
    transform:scale(1.05);
}

.carta{
    display:none;
    margin-top:25px;
    background:rgba(255,255,255,.10);
    backdrop-filter:blur(10px);
    border-radius:25px;
    padding:25px;
    text-align:left;
    line-height:1.9;
    overflow:visible;
}

#textoCarta{
    white-space:pre-line;
    font-size:1rem;
}

.cursor{
    animation:parpadear .8s infinite;
}

@keyframes parpadear{
    50%{
        opacity:0;
    }
}

.mensaje-final{
    margin-top:25px;
    text-align:center;
    font-size:1.4rem;
    color:#ffd6e7;
    font-weight:bold;
}

.firma{
    margin-top:25px;
    text-align:center;
    color:#fff0f6;
    font-style:italic;
}

#sorpresa{
    display:none;
    text-align:center;
    margin-top:25px;
    font-size:1.3rem;
    font-weight:bold;
    color:#ffe57f;
    animation:brillo 2s infinite;
}

@keyframes brillo{
    50%{
        text-shadow:0 0 15px gold;
    }
}

.flotante{
    position:fixed;
    top:-100px;
    pointer-events:none;
    z-index:1;
    animation:caer linear forwards;
}

@keyframes caer{

    0%{
        transform:
        translateY(-100px)
        rotate(0deg);
        opacity:1;
    }

    100%{
        transform:
        translateY(120vh)
        rotate(720deg);
        opacity:0;
    }

}

@media(max-width:600px){

    .carta{
        padding:18px;
    }

    #textoCarta{
        font-size:.95rem;
    }

}

</style>

</head>

<body>

<div class="container">

    <h1>🎂 Feliz Cumpleaños Caroline Romero ❤️</h1>

    <p class="subtitulo">
        Hoy celebramos a una persona hermosa, especial y única.
    </p>

    <button id="btnCarta">
        💌 Abrir Carta Especial
    </button>

    <div id="carta" class="carta">

        <p id="textoCarta"></p>

        <div class="mensaje-final">
            🎂❤️ ¡Feliz Cumpleaños Amiga! ❤️🎂
        </div>

        <div id="sorpresa">
            🌻 Eres una persona muy especial, Caroline 🌻
        </div>

        <div class="firma">
            🌻 Con mucho cariño para una amiga increíble 🌻
            <br><br>
            Carlos 💛
        </div>

    </div>

</div>

<script>

const carta = document.getElementById("carta");
const btnCarta = document.getElementById("btnCarta");
const textoCarta = document.getElementById("textoCarta");
const sorpresa = document.getElementById("sorpresa");

const mensaje = `Querida Caroline Romero,

Hoy es un día muy especial porque celebramos que cumples un año más de vida.

Quiero desearte un cumpleaños lleno de felicidad, salud, sueños cumplidos y momentos inolvidables.

Hay personas que destacan por su belleza y otras por la luz que transmiten. Tú tienes ambas cualidades.

Tu sonrisa ilumina los días y tu presencia tiene la capacidad de hacer más bonito cualquier lugar.

Y si hay algo que siempre llama la atención con una elegancia imposible de ignorar, es tu hermoso cabello negro.

Tan brillante como una noche estrellada y tan elegante como una obra de arte.

Pero más allá de lo que se ve, lo que realmente te hace especial es tu forma de ser, tu bondad y el hermoso corazón que tienes.

Que este nuevo año de vida esté lleno de bendiciones, nuevas aventuras y muchas razones para sonreír.

Nunca olvides lo increíble que eres.

Gracias por existir y por ser una persona tan maravillosa.

Espero que este día esté lleno de sonrisas, abrazos sinceros y momentos que recuerdes para siempre.

✨ Feliz Cumpleaños Caroline ✨`;

btnCarta.addEventListener("click", ()=>{

    if(carta.style.display === "block"){

        carta.style.display = "none";
        btnCarta.innerHTML = "💌 Abrir Carta Especial";
        textoCarta.innerHTML = "";
        sorpresa.style.display = "none";
        return;
    }

    carta.style.display = "block";
    btnCarta.innerHTML = "❤️ Carta Abierta";

    textoCarta.innerHTML = "";
    sorpresa.style.display = "none";

    let i = 0;

    function escribir(){

        if(i < mensaje.length){

            textoCarta.innerHTML =
            mensaje.substring(0,i+1) +
            '<span class="cursor">|</span>';

            i++;

            window.scrollTo({
                top:document.body.scrollHeight,
                behavior:"smooth"
            });

            setTimeout(escribir,30);

        }else{

            textoCarta.innerHTML = mensaje;

            sorpresa.style.display = "block";

            window.scrollTo({
                top:document.body.scrollHeight,
                behavior:"smooth"
            });

        }

    }

    escribir();

});

function crearGirasol(){

    const elementos = [
        "🌻",
        "🌻",
        "🌻",
        "💛",
        "🌼",
        "❤️",
        "✨"
    ];

    const item = document.createElement("div");

    item.classList.add("flotante");

    item.innerHTML =
    elementos[Math.floor(Math.random()*elementos.length)];

    item.style.left =
    Math.random()*100 + "vw";

    item.style.fontSize =
    (20 + Math.random()*25) + "px";

    item.style.animationDuration =
    (6 + Math.random()*6) + "s";

    document.body.appendChild(item);

    setTimeout(()=>{
        item.remove();
    },12000);
}

setInterval(crearGirasol,200);

</script>

</body>
</html>
